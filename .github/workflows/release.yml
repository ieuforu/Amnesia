name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "error: tag $GITHUB_REF_NAME doesn't match app version $version" >&2
            exit 1
          fi
      - name: Run tests
        run: swift test
      - name: Package the app
        run: scripts/package-release.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .build/Amnesia-*.zip --verify-tag --generate-notes --title "Amnesia ${GITHUB_REF_NAME#v}"
