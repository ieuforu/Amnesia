name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Run tests
        run: swift test
      - name: Package the app
        run: scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Amnesia
          path: .build/Amnesia-*.zip
          retention-days: 7
